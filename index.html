<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Store</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/GQ0SR6P7/b8b6fd228823037-Y3-Jvc-Cwy-Nj-Aw-LDIw-Mz-Qs-MTgw-LDgx-MQ.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>

<aside class="sidebar">
  <h2 class="logo" onclick="location.href='index.html'">
    <img src="https://i.ibb.co/66fFVKh/831378.png" alt="">App Store
  </h2>
  <input id="search" class="search" type="search" placeholder="Search" autocomplete="off">
  <nav class="menu">
    <a href="index.html">Today</a>
    <a href="index.html">Games</a>
    <a href="index.html">Apps</a>
  </nav>
</aside>

<main class="main">
  <div id="pageTitle" class="header-title"></div>

  <section class="today">
    <div id="hero" class="big-card"></div>
    <div id="tip" class="small-card"></div>
  </section>

  <section class="apps-row">
    <div class="app-card left-card">
      <span id="topKicker"></span>
      <h2 id="topTitle"></h2>
      <div class="app-list" id="leftList"></div>
    </div>
    <div class="app-card right-card">
      <span id="essKicker"></span>
      <h2 id="essTitle"></h2>
      <div class="app-list" id="rightList"></div>
    </div>
  </section>
</main>

<!-- Thứ tự quan trọng: dữ liệu -> hàm chung -> render -> video -->
<script src="data/apps.js"></script>
<script src="js/common.js"></script>
<script src="js/home.js"></script>
<script src="js/video-lazy.js" defer></script>
</body>
</html>
